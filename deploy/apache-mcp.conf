# Apache2 VirtualHost reference configuration for gitea-mcp
#
# Required Apache modules:
#   sudo a2enmod proxy proxy_http ssl headers
#   sudo a2ensite apache-mcp.conf
#   sudo systemctl reload apache2

<VirtualHost *:80>
    ServerName mcp.example.com
    ServerAdmin admin@example.com

    # Redirect all HTTP requests to HTTPS
    Redirect permanent / https://mcp.example.com/

    ErrorLog ${APACHE_LOG_DIR}/gitmcp_error.log
</VirtualHost>

<VirtualHost *:443>
    ServerName mcp.example.com
    ServerAdmin admin@example.com

    # TLS termination using Let's Encrypt certificates
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/mcp.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/mcp.example.com/privkey.pem

    # Disable compression to preserve streaming/SSE responses and prevent buffering
    SetEnv no-gzip 1

    # Privacy and security: log format without query strings (%q) or Referer header
    # Uses method (%m), URL path without query (%U), and HTTP protocol (%H)
    LogFormat "%h %l %u %t \"%m %U %H\" %>s %b" gitmcp_noquery
    CustomLog ${APACHE_LOG_DIR}/gitmcp_access.log gitmcp_noquery
    ErrorLog ${APACHE_LOG_DIR}/gitmcp_error.log

    # Reverse proxy to gitea-mcp container listening on 127.0.0.1:3040
    ProxyPreserveHost On
    ProxyRequests Off

    ProxyPass / http://127.0.0.1:3040/ flushpackets=on timeout=300
    ProxyPassReverse / http://127.0.0.1:3040/
</VirtualHost>
