services:
  gitea-mcp-oauth:
    image: ${GITEA_MCP_IMAGE:?GITEA_MCP_IMAGE must be set in .env}
    container_name: gitea-mcp-oauth
    restart: unless-stopped
    ports:
      # Bind to localhost only; the reverse proxy terminates TLS
      - "${HOST_BIND:-127.0.0.1}:${HOST_PORT:-3040}:8080"
    secrets:
      - gitea_oauth_client_secret
      - gitea_oauth_signing_key
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command:
      - /app/gitea-mcp
      - --transport=http
      - --bind=0.0.0.0
      - --port=8080
      - --host=${GITEA_HOST:?GITEA_HOST must be set in .env}
      - --oauth-client-id=${GITEA_OAUTH_CLIENT_ID:?GITEA_OAUTH_CLIENT_ID must be set in .env}
      - --oauth-public-url=${GITEA_OAUTH_PUBLIC_URL:?GITEA_OAUTH_PUBLIC_URL must be set in .env}
      - --oauth-allowed-user=${GITEA_OAUTH_ALLOWED_USER:?GITEA_OAUTH_ALLOWED_USER must be set in .env}
      - --oauth-allowed-redirect-uris=${GITEA_OAUTH_ALLOWED_REDIRECT_URIS:?GITEA_OAUTH_ALLOWED_REDIRECT_URIS must be set in .env}
      - --oauth-client-secret-file=/run/secrets/gitea_oauth_client_secret
      - --oauth-signing-key-file=/run/secrets/gitea_oauth_signing_key

secrets:
  gitea_oauth_client_secret:
    file: ${GITEA_OAUTH_CLIENT_SECRET_FILE:-./client.secret}
  gitea_oauth_signing_key:
    file: ${GITEA_OAUTH_SIGNING_KEY_FILE:-./signing.key}
